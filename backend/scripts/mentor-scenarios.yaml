      mode: practice
      mentorLocale: tr
    expect:
      validatorDecision: allow
      mustContainAnyOf: ["TypeError", "type", "int", "str"]
      maxSentences: 4
      replyLanguageIs: tr

  - name: tr-08-hint-level-0
    description: Turkish first hint.
    request:
      <<: *problem
      studentQuestion: ""
      mode: hint
      hintLevel: 0
      mentorLocale: tr
    expect:
      maxSentences: 1
      mustNotContainCodeBlock: true
      replyLanguageIs: tr

  - name: tr-09-hint-level-3
    description: Turkish mid-level hint.
    request:
      <<: *problem
      studentQuestion: ""
      mode: hint
      hintLevel: 3
      mentorLocale: tr
    expect:
      maxSentences: 2
      replyLanguageIs: tr

  - name: tr-10-memory-followup
    description: Turkish memory check.
    request:
      <<: *problem
      studentQuestion: "Az önce büyük-küçük harf konusunda ne demiştin, hatırlatır mısın?"
