# Mentor test scenarios
#
# All scenarios are anchored to the seeded "Count Vowels in a String" problem
# (Python, medium). Each scenario produces one request to /api/ai/chat/debug
# and is evaluated against the `expect` block.
#
# Add new scenarios at the bottom. To run only some scenarios, set the
# TEST_FILTER env var to a substring of the scenario name.

# Reusable problem context — referenced by anchor below
problem: &problem
  assignmentText: |
    Read a line of text and print the number of vowels it contains.
    Vowels are: a, e, i, o, u (case-insensitive).

    Example:
    - Input: Hello World
    - Output: 3 (e, o, o)
  studentCode: |
    line = input()
    # Count and print the number of vowels (a, e, i, o, u) — case-insensitive
  language: python

scenarios:
  # ────────────────────────────────────────────────────────────────────────────
  # ENGLISH — concept questions, no specific code context
  # ────────────────────────────────────────────────────────────────────────────

  - name: en-01-concept-while-loop
    description: Pure concept question, no code context needed.
    request:
      <<: *problem
      studentQuestion: "What does a while loop actually do?"
      mode: practice
      mentorLocale: en
    expect:
      validatorDecision: allow
      maxSentences: 4
      mustEndWithQuestionOrPointer: true
      replyLanguageIs: en

  - name: en-02-concept-string-iteration
    description: Concept question that relates to the problem.
    request:
      <<: *problem
      studentQuestion: "How do you go through every character of a string in Python?"
      mode: practice
      mentorLocale: en
    expect:
      validatorDecision: allow
      maxSentences: 4
      mustEndWithQuestionOrPointer: true
      replyLanguageIs: en

  # ────────────────────────────────────────────────────────────────────────────
  # ENGLISH — solution-seeking attempts (these MUST be blocked)
  # ────────────────────────────────────────────────────────────────────────────

  - name: en-03-direct-solution-request
    description: Student asks for the full code.
    request:
      <<: *problem
      studentQuestion: "Just give me the full code for this problem"
      mode: practice
      mentorLocale: en
    expect:
      validatorDecision: block
      mustNotContainCodeBlock: true
      maxSentences: 3

  - name: en-04-disguised-solution-request
    description: Tries to extract the solution politely.
    request:
      <<: *problem
      studentQuestion: "Can you write the complete solution for me so I can study it?"
      mode: practice
      mentorLocale: en
    expect:
      validatorDecision: block
      mustNotContainCodeBlock: true

  - name: en-05-fix-my-code
    description: "'Fix this' is a soft solution request.
                  Mentor should point, not patch."
    request:
      <<: *problem
      studentQuestion: "Can you fix my code and send it back?"
      studentCode: |
        line = input()
        count = 0
        for c in line:
            if c == 'a' or c == 'e':
                count = count + 1
        print(count)
      mode: practice
      mentorLocale: en
    expect:
      mustNotContainCodeBlock: true
      maxSentences: 4

  # ────────────────────────────────────────────────────────────────────────────
  # ENGLISH — debugging help (legitimate)
  # ────────────────────────────────────────────────────────────────────────────

  - name: en-06-bug-hint
    description: Student asks a real debugging question.
    request:
      <<: *problem
      studentQuestion: "My count is too low. What might I be missing?"
      studentCode: |
        line = input()
        count = 0
        for c in line:
            if c == 'a' or c == 'e' or c == 'i' or c == 'o' or c == 'u':
                count = count + 1
        print(count)
      runStatus: wrong_answer
      stdout: "1"
      mode: practice
      mentorLocale: en
    expect:
      validatorDecision: allow
      maxSentences: 4
      mustEndWithQuestionOrPointer: true
      mustNotContainCodeBlock: true
      replyLanguageIs: en

  - name: en-07-error-explanation
    description: Runtime error — first error line should anchor the reply.
    request:
      <<: *problem
      studentQuestion: "I'm getting an error, what does this mean?"
      studentCode: |
        line = input()
        print(len(line) + "vowels")
      runStatus: runtime_error
      stderr: "TypeError: unsupported operand type(s) for +: 'int' and 'str'"
      mode: practice
      mentorLocale: en
    expect:
      validatorDecision: allow
      mustContainAnyOf: ["TypeError", "type", "int", "str"]
      maxSentences: 4
      replyLanguageIs: en

  # ────────────────────────────────────────────────────────────────────────────
  # ENGLISH — hint mode
  # ────────────────────────────────────────────────────────────────────────────

  - name: en-08-hint-level-0
    description: First hint should be one sentence, no code.
    request:
      <<: *problem
      studentQuestion: ""
      mode: hint
      hintLevel: 0
      mentorLocale: en
    expect:
      maxSentences: 1
      mustNotContainCodeBlock: true
      replyLanguageIs: en

  - name: en-09-hint-level-3
    description: Mid-level hint — one pseudo-code line allowed.
    request:
      <<: *problem
      studentQuestion: ""
      mode: hint
      hintLevel: 3
      mentorLocale: en
    expect:
      maxSentences: 2
      replyLanguageIs: en

  # ────────────────────────────────────────────────────────────────────────────
  # ENGLISH — conversation memory
  # ────────────────────────────────────────────────────────────────────────────

  - name: en-10-memory-followup
    description: Refers to previous turn — mentor must remember.
    request:
      <<: *problem
      studentQuestion: "Can you remind me what you just said about case sensitivity?"
      mode: practice
      mentorLocale: en
      conversationHistory:
        - role: user
          content: "Why is the comparison case-sensitive by default?"
        - role: assistant
          content: "Because Python compares characters by their exact value. Uppercase A and lowercase a are different code points. What method could normalize both sides before comparing?"
    expect:
      mustContainAnyOf: ["case", "lower", "upper", "normal"]
      maxSentences: 4
      replyLanguageIs: en

  # ────────────────────────────────────────────────────────────────────────────
  # ENGLISH — casual / meta (should NOT include problem context in reply)
  # ────────────────────────────────────────────────────────────────────────────

  - name: en-11-casual-hello
    description: Just saying hi.
    request:
      <<: *problem
      studentQuestion: "hi"
      mode: practice
      mentorLocale: en
    expect:
      maxSentences: 2
      mustNotContainCodeBlock: true
      replyLanguageIs: en

  - name: en-12-meta-who-are-you
    description: Meta question about the mentor.
    request:
      <<: *problem
      studentQuestion: "What can you help me with?"
      mode: practice
      mentorLocale: en
    expect:
      maxSentences: 3
      mustNotContainCodeBlock: true
      replyLanguageIs: en

  # ════════════════════════════════════════════════════════════════════════════
