        - role: assistant
          content: "Çünkü Python karakterleri tam değerlerine göre karşılaştırır. Büyük A ile küçük a farklı kod noktalarıdır. Karşılaştırmadan önce iki tarafı da normalleştirmek için hangi yöntemi kullanabilirsin?"
