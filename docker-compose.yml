services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Force same-origin /api (nginx proxy). Root .env must not override this for cloud builds.
      args:
        VITE_API_BASE_URL: ""
    container_name: app-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Docker-outside-of-Docker paths for the interactive terminal sandbox
      - RUNNER_TMP_HOST=/tmp/ai-runner      # path on the Docker HOST daemon
      - RUNNER_TMP_CONTAINER=/runner-tmp    # same tree mounted inside backend
    volumes:
      # Docker socket — lets the backend call `docker run` on the host daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared temp dir: backend writes code files here; Docker daemon mounts them
      - /tmp/ai-runner:/runner-tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Pre-pull all language runner images so students don't wait on first run.
  # Runs once at stack startup, then exits.
  runner-init:
    image: docker:cli
    container_name: runner-init
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "
        docker pull python:3.12-slim &&
        docker pull node:20-slim &&
        docker pull gcc:13 &&
        docker pull eclipse-temurin:21-jdk-alpine &&
        docker pull mcr.microsoft.com/dotnet/sdk:8.0-alpine &&
        echo 'All runner images ready.'
      "

  postgres:
    image: postgres:16
    container_name: app-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep loaded models resident in VRAM forever so the first request after
      # an idle period does not pay cold-load latency.
      - OLLAMA_KEEP_ALIVE=-1
      # Allow both the mentor (~9 GB) and validator (~2.4 GB) to coexist in
      # VRAM at the same time — 14B + 3B easily fit on a single 23 GB L4.
      - OLLAMA_MAX_LOADED_MODELS=2
      # Serve up to two concurrent requests per loaded model. Safe with the
      # 14B mentor; revisit if upgrading to 30B on a tighter VRAM budget.
      - OLLAMA_NUM_PARALLEL=2
      # Flash attention shrinks KV-cache memory by ~30-40 %. Free win on Ampere
      # and Ada (L4 is Ada) — no downside.
      - OLLAMA_FLASH_ATTENTION=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

    deploy:
     resources:
       reservations:
         devices:
           - driver: nvidia
             count: all
             capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
        ollama pull $$OLLAMA_MODEL &&
        ollama pull $$OLLAMA_VALIDATOR_MODEL
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:14b}
      - OLLAMA_VALIDATOR_MODEL=${OLLAMA_VALIDATOR_MODEL:-qwen2.5:3b-instruct}

volumes:
  postgres_data:
  ollama_data:
  # NuGet package cache shared across C# runner containers so restore is fast
  ai-runner-nuget: