<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Option 1: "</> + chat bubble" — Code + AI dialogue.
       The angle brackets represent code; the small dot/bubble in the corner
       represents the AI mentor responding. Conveys "code + conversation". -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B4DFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#g1)"/>
  <!-- </> code brackets -->
  <path d="M22 22 L13 32 L22 42" stroke="#fff" stroke-width="3.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 22 L51 32 L42 42" stroke="#fff" stroke-width="3.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="36" y1="20" x2="28" y2="44" stroke="#fff" stroke-width="3.5"
        stroke-linecap="round"/>
  <!-- Chat-bubble dot in top-right corner -->
  <circle cx="50" cy="14" r="6" fill="#22D3EE" stroke="#fff" stroke-width="2"/>
</svg>
